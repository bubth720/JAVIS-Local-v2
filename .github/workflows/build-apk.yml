name: Build JARVIS Local APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download offline models
        run: bash tools/prepare_models.sh

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-Local-v2.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jarvis-v2-build-${{ github.run_number }}"
          gh release create "$TAG" JARVIS-Local-v2.apk             --title "JARVIS Local v2 - build ${{ github.run_number }}"             --notes "APK autonome : Qwen3 1.7B GGUF + Whisper base embarqués. Le noyau ne demande aucune permission Internet."

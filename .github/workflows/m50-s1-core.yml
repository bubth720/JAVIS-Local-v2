name: M50-S1 CORE exact-source regression
on:
  push:
    branches: [codex/m50-s1-core-ci-20261029]
  pull_request:
    branches: [mission/m50-integrated-beta-20261029]
permissions:
  contents: read
concurrency:
  group: m50-s1-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: core
          fetch-depth: 0
          persist-credentials: false
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Test exact scope and routes, preserve historical guards at their own SHAs
        working-directory: core
        run: |
          python3 -m unittest discover -s tests/m50_s1 -v
          python3 tools/check-m50-s1-core.py --historical
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bubth720/JARVIS-NEXUS
          ref: 777e6afa75ecb99b85e52d68837cb0fefcf161cd
          path: dependencies/nexus
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bubth720/JARVIS-SERVICES
          ref: 3decdc47d82f9b43713c48cab244762941770a81
          path: dependencies/services
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Validate immutable dependency snapshots
        working-directory: core
        run: |
          python3 tools/prepare-core03-sources.py nexus "$RUNNER_TEMP/nexus" --checkout ../dependencies/nexus
          python3 tools/prepare-core03-sources.py services "$RUNNER_TEMP/services" --checkout ../dependencies/services
      - name: Real JVM libraries on synthetic files, no model or personal data
        working-directory: core
        run: >-
          gradle -p integration-lab
          -PcoreNexusSource="$RUNNER_TEMP/nexus" -PcoreServicesSource="$RUNNER_TEMP/services"
          test run --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Pinned Android SDK35 tooling, no model or device installation
        working-directory: core
        run: python3 tools/setup-preview-android.py
      - name: Historical suite and lot4 cases; all existing debug laboratory variants build and lint
        working-directory: core
        run: >-
          gradle -PincludeP2Fixture=true :app:testDebugUnitTest
          :app:testMvp2UnitTest --tests '*Mvp*' --tests '*MemoryLabUiTest*'
          :p2-client:testDebugUnitTest :app:assembleDebug :app:assemblePreview
          :app:assembleMvp :app:assembleMvp2 :app:assembleMvp3
          :app:lintDebug :app:lintPreview :app:lintMvp :app:lintMvp2 :app:lintMvp3
          --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Compare actual case identities; record source and tree without summing reruns
        working-directory: core
        run: python3 tools/check-m50-s1-core.py --results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M50-S1-CORE-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            core/integration-lab/build/test-results/test/TEST-*.xml
            core/app/build/test-results/**/TEST-*.xml
            core/fixtures/p2-client/build/test-results/**/TEST-*.xml
            core/app/build/reports/lint-results-*.xml
            core/app/build/reports/m50-s1/RESULTS.json

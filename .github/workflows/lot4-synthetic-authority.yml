name: CORE lot4 isolated synthetic authority gate
on:
  push:
    branches: ['feat/lot4-offline-recovery-*']
  pull_request:
    branches: ['mission/adr002-principles-lot4-20261028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK prerequisites
        run: python3 tools/setup-preview-android.py
      - name: Run actual CORE synthetic authority JUnit cases
        run: >-
          gradle :app:testDebugUnitTest
          --tests '*CoreLot4SyntheticAuthorityTest*'
          --no-daemon --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
      - name: Ensure production sources and manifest were not changed
        run: |
          git diff --exit-code b51a3720fd7abd7adaf65983c5fa4363f5ead225 -- app/src/main app/src/mvp2 app/src/mvp3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-lot4-synthetic-junit
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml

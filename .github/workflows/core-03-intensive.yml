name: CORE-03 pinned JVM integration laboratory
on:
  push:
    branches: [feat/core-03-intensive]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {path: core, fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: bubth720/JARVIS-NEXUS
          ref: 777e6afa75ecb99b85e52d68837cb0fefcf161cd
          path: dependencies/nexus
      - uses: actions/checkout@v4
        with:
          repository: bubth720/JARVIS-SERVICES
          ref: 3decdc47d82f9b43713c48cab244762941770a81
          path: dependencies/services
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Preserve Android and prepare exact build-only snapshots
        working-directory: core
        run: |
          python3 tools/check-core-03.py
          python3 tools/prepare-core03-sources.py nexus "$RUNNER_TEMP/core03-nexus" --checkout ../dependencies/nexus
          python3 tools/prepare-core03-sources.py services "$RUNNER_TEMP/core03-services" --checkout ../dependencies/services
      - name: Actual library calls and tests, no models or APK installation
        working-directory: core
        run: >-
          gradle -p integration-lab
          -PcoreNexusSource="$RUNNER_TEMP/core03-nexus"
          -PcoreServicesSource="$RUNNER_TEMP/core03-services"
          test run --no-daemon --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CORE-03-JVM-test-reports
          path: core/integration-lab/build/test-results/test/TEST-*.xml
          if-no-files-found: error
